name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: support_test
          POSTGRES_USER: support_test
          POSTGRES_PASSWORD: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_test -d support_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SUPPORT_TEST_DATABASE_URL: postgres://support_test:support_test@localhost:5432/support_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
